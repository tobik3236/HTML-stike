<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STRIKE 2 — редактор карт</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:#e8eaed;font:13px system-ui,sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0}
#p{position:fixed;left:8px;top:8px;width:200px;max-height:calc(100% - 16px);overflow:auto;background:rgba(12,14,18,.9);border-radius:10px;padding:6px;z-index:5}
#p button,#p select,#p input[type=text]{display:block;width:100%;box-sizing:border-box;margin:3px 0;padding:7px;border-radius:8px;border:2px solid #333;background:#1b1f26;color:#e8eaed;font-size:13px;text-align:left}
#p button.on{border-color:#ff9f1c}#p p{margin:6px 0 0}#p input[type=range]{width:100%}#p small{opacity:.6;font-size:11px;display:block;margin-top:6px}</style></head><body>
<div id="p"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N=64,CS=2,HH=[0,6,2,6,4],COL=[0,0xd9c08a,0x8a5a2b,0x2a3f66,0x6b4a22],$=id=>document.getElementById(id);
let G=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x*y==0||x==N-1||y==N-1?1:0)),HT=Array.from({length:N+1},()=>new Float32Array(N+1));
const gh=(x,z)=>{const u=Math.min(N-.001,Math.max(0,x/CS)),v=Math.min(N-.001,Math.max(0,z/CS)),i=u|0,j=v|0,a=u-i,b=v-j;return HT[j][i]*(1-a)*(1-b)+HT[j][i+1]*a*(1-b)+HT[j+1][i]*(1-a)*b+HT[j+1][i+1]*a*b};
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.5,800);scene.background=new THREE.Color(0x8fbbe6);
scene.add(new THREE.HemisphereLight(0xffffff,0x998866,.9));const sun=new THREE.DirectionalLight(0xfff1d6,.9);sun.position.set(60,100,40);scene.add(sun);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(N*CS,N*CS,N,N),new THREE.MeshStandardMaterial({color:0xc9b48a,roughness:1,vertexColors:true}));fl.rotation.x=-Math.PI/2;fl.position.set(N,0,N);scene.add(fl);
const grid=new THREE.LineSegments(new THREE.WireframeGeometry(fl.geometry),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:.12}));fl.add(grid);
function terr(){const p=fl.geometry.attributes.position,h=N,c=[];for(let i=0;i<p.count;i++){const z=gh(p.getX(i)+h,h-p.getY(i));p.setZ(i,z);const k=.75+Math.max(-.3,Math.min(.35,z*.07));c.push(k,k*.95,k*.8)}fl.geometry.setAttribute('color',new THREE.Float32BufferAttribute(c,3));p.needsUpdate=true;fl.geometry.computeVertexNormals();fl.geometry.computeBoundingSphere();fl.geometry.computeBoundingBox();grid.geometry.dispose();grid.geometry=new THREE.WireframeGeometry(fl.geometry);walls()}
const wm=new THREE.InstancedMesh(new THREE.BoxGeometry(CS,1,CS),new THREE.MeshStandardMaterial({roughness:.9}),N*N);scene.add(wm);const dm=new THREE.Object3D(),cc=new THREE.Color();
function walls(){let n=0;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=G[y][x];if(!c)continue;const h=HH[c],cx=(x+.5)*CS,cz=(y+.5)*CS;dm.position.set(cx,gh(cx,cz)+h/2,cz);dm.scale.set(1,h,1);dm.updateMatrix();wm.setMatrixAt(n,dm.matrix);wm.setColorAt(n,cc.setHex(COL[c]));n++}wm.count=n;wm.instanceMatrix.needsUpdate=true;if(wm.instanceColor)wm.instanceColor.needsUpdate=true}
// спауны (в игре заданы зонами): T — x58..62,y18..25 · КТ — x12..19,y45..49
const zone=(x0,x1,y0,y1,col)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry((x1-x0+1)*CS,(y1-y0+1)*CS),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.35,depthTest:false}));m.rotation.x=-Math.PI/2;m.position.set((x0+(x1-x0+1)/2)*CS,.3,(y0+(y1-y0+1)/2)*CS);m.renderOrder=5;scene.add(m)};zone(58,62,18,25,0xff9f1c);zone(12,19,45,49,0x3399ff);
let ET='up',ER=3,ES=3,eDown=false,name='mymap';const ev={yaw:.8,pit:.95,d:110,x:64,z:64,px:innerWidth/2,py:innerHeight/2,fh:0};
const cur=new THREE.Mesh(new THREE.RingGeometry(.92,1,48),new THREE.MeshBasicMaterial({color:0xffcc33,side:THREE.DoubleSide,depthTest:false}));cur.rotation.x=-Math.PI/2;cur.renderOrder=9;scene.add(cur);
const T=[['cam','✋ Камера (тяни)'],['up','⬆ Поднять'],['dn','⬇ Опустить'],['sm','〰 Сгладить'],['fl','▬ Выровнять'],['w1','▮ Стена (6)'],['w2','▮ Ящик (2)'],['w3','▮ Высокая (6)'],['w4','▮ Средняя (4)'],['w0','✖ Убрать стену']];
$('p').innerHTML='<input type="text" id="nm" value="mymap" maxlength="24" placeholder="имя карты"><select id="ls"></select><button data-a="open">📂 Открыть из maps/</button><button data-a="file">📁 Открыть файл…</button><button data-a="new">📄 Новая карта</button><input type="file" id="fi" accept=".st2map,.json" hidden>'+T.map(([k,n])=>`<button data-e="${k}">${n}</button>`).join('')+'<p>Радиус</p><input type="range" id="er" min="1" max="10" value="3"><p>Сила</p><input type="range" id="es" min="1" max="10" value="3"><button data-z="-1">＋ приблизить</button><button data-z="1">－ отдалить</button><button data-a="save">💾 Скачать .st2map</button><small>ПКМ — вращение, колесо — зум, WASD — движение. Оранжевая зона — спаун T, синяя — спаун КТ. Файл положите в maps/ и добавьте имя в maps/maps.json.</small>';
const sel=()=>document.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',x.dataset.e==ET));sel();
function load(m){if(!m||!m.g||m.g.length!=N){alert('Неверный файл карты');return}G=m.g.map(r=>Array.from({length:N},(_,x)=>+r[x]||0));HT.forEach(r=>r.fill(0));if(m.h)for(let j=0;j<=N;j++)for(let i=0;i<=N;i++)HT[j][i]=+(m.h[j]&&m.h[j][i])||0;name=m.name||name;$('nm').value=name;terr()}
fetch('maps/maps.json').then(r=>r.json()).then(a=>{$('ls').innerHTML=a.map(n=>`<option>${n}</option>`).join('');if(a.includes('mirage'))fetch('maps/mirage.st2map').then(r=>r.json()).then(load)}).catch(()=>{$('ls').innerHTML='<option>(нужен http-сервер)</option>'});
$('p').addEventListener('input',e=>{if(e.target.id=='er')ER=+e.target.value;if(e.target.id=='es')ES=+e.target.value});
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(s=>{try{load(JSON.parse(s))}catch(x){alert('Не удалось прочитать файл')}})};
$('p').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.e){ET=d.e;sel()}else if(d.z)ev.d=Math.max(25,Math.min(260,ev.d*(d.z<0?.8:1.25)));
 else if(d.a=='open')fetch('maps/'+$('ls').value+'.st2map').then(r=>r.json()).then(load).catch(()=>alert('Не удалось открыть'));
 else if(d.a=='file')$('fi').click();else if(d.a=='new'){G=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>x*y==0||x==N-1||y==N-1?1:0));HT.forEach(r=>r.fill(0));terr()}
 else if(d.a=='save'){const n=($('nm').value||'mymap').toLowerCase().replace(/[^\w-]/g,'')||'mymap',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({name:n,g:G.map(r=>r.join('')),h:HT.map(r=>Array.from(r,v=>+v.toFixed(2)))})],{type:'application/json'}));a.download=n+'.st2map';a.click()}});
const rc=new THREE.Raycaster();function ray(){cam.updateMatrixWorld();rc.setFromCamera(new THREE.Vector2(ev.px/innerWidth*2-1,-ev.py/innerHeight*2+1),cam);const h=rc.intersectObject(fl)[0];return h&&h.point}
function brush(p){if(ET[0]=='w'){const c=+ET[1],q=Math.round(ER/3);let ch=0;for(let dy=-q;dy<=q;dy++)for(let dx=-q;dx<=q;dx++){const x=(p.x/CS|0)+dx,y=(p.z/CS|0)+dy;if(x>0&&y>0&&x<N-1&&y<N-1&&G[y][x]!==c){G[y][x]=c;ch=1}}if(ch)walls();return}
 const r=ER*CS;for(let j=Math.max(0,Math.floor((p.z-r)/CS));j<=Math.min(N,Math.ceil((p.z+r)/CS));j++)for(let i=Math.max(0,Math.floor((p.x-r)/CS));i<=Math.min(N,Math.ceil((p.x+r)/CS));i++){const d=Math.hypot(i*CS-p.x,j*CS-p.z)/r;if(d>=1)continue;const f=1-d;let h=HT[j][i];
  if(ET=='up')h+=ES*f*.04;else if(ET=='dn')h-=ES*f*.04;else if(ET=='fl')h+=(ev.fh-h)*f*.25;else if(ET=='sm'){const a=(HT[Math.max(0,j-1)][i]+HT[Math.min(N,j+1)][i]+HT[j][Math.max(0,i-1)]+HT[j][Math.min(N,i+1)])/4;h+=(a-h)*f*.4}HT[j][i]=Math.max(-8,Math.min(16,h))}terr()}
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
function frame(){const k=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),v=ev.d*.012,sy=Math.sin(ev.yaw),cy=Math.cos(ev.yaw);ev.x=Math.max(0,Math.min(128,ev.x+(-sy*k+cy*s)*v));ev.z=Math.max(0,Math.min(128,ev.z+(-cy*k-sy*s)*v));
 cam.position.set(ev.x+sy*Math.cos(ev.pit)*ev.d,Math.sin(ev.pit)*ev.d,ev.z+cy*Math.cos(ev.pit)*ev.d);cam.lookAt(ev.x,0,ev.z);
 const p=ray();cur.visible=!!p;if(p){cur.position.set(p.x,p.y+.2,p.z);cur.scale.setScalar(ER*CS);if(eDown)brush(p)}ren.render(scene,cam);requestAnimationFrame(frame)}
const cv=ren.domElement;let ld=null;cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{ev.px=e.clientX;ev.py=e.clientY;ld=[e.clientX,e.clientY];eDown=e.button==0&&ET!='cam';if(eDown&&ET=='fl'){const p=ray();if(p)ev.fh=p.y}try{cv.setPointerCapture(e.pointerId)}catch(x){}});
cv.addEventListener('pointermove',e=>{ev.px=e.clientX;ev.py=e.clientY;if(ld){if(e.buttons&6||ET=='cam'){ev.yaw-=(e.clientX-ld[0])*.008;ev.pit=Math.max(.15,Math.min(1.5,ev.pit+(e.clientY-ld[1])*.006))}ld=[e.clientX,e.clientY]}});
cv.addEventListener('pointerup',()=>{eDown=false;ld=null});cv.addEventListener('wheel',e=>{ev.d=Math.max(25,Math.min(260,ev.d*(1+Math.sign(e.deltaY)*.1)))},{passive:true});
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
terr();frame();
</script></body></html>
